# CI for resilient-mlkit.
#
# THIS WORKFLOW HAS EXECUTED, AND THESE ARE THE RUNS.
#
# It said the opposite until v0.6.0: forty lines declaring the file unverified,
# reporting that GitHub Actions was failing account-wide on billing, and
# disclaiming any run at all. That was measured true on 2026-08-28 and it is
# withdrawn here rather than quietly dropped. The withdrawn wording is
# deliberately paraphrased and not reproduced: tests/test_ci_workflow.py scans
# this header for the sentences that deny a run, and a checker that had to tell
# a live denial from a quoted one would be a checker with a quoting loophole.
# A header describing a workflow that no longer exists is this package's own
# defect class aimed at this package a second time.
#
# Retrieved 2026-09-01 with `gh run list --repo Resilient-World/resilient-mlkit`.
# Every one of these completed with conclusion `success`, against the workflow
# definition as it stood at the sha named on its row -- this header is prose and
# is not what executed:
#
#   33499020378  main   6921e9a  push          2026-09-01T10:45:22Z
#     https://github.com/Resilient-World/resilient-mlkit/actions/runs/33499020378
#   33562502701  verify/i1-m2-adversarial            a534e9be  pull_request
#     https://github.com/Resilient-World/resilient-mlkit/actions/runs/33562502701
#   33560677454  feat/track-aware-splits-contract    1896184f  pull_request
#     https://github.com/Resilient-World/resilient-mlkit/actions/runs/33560677454
#   33560662411  feat/track-aware-splits-contract    1896184f  push
#     https://github.com/Resilient-World/resilient-mlkit/actions/runs/33560662411
#   33558666743  fix/m-d6-crosscut-proportional      e6966830  pull_request
#     https://github.com/Resilient-World/resilient-mlkit/actions/runs/33558666743
#   33558545955  fix/m-d6-crosscut-proportional      923c8da9  pull_request
#     https://github.com/Resilient-World/resilient-mlkit/actions/runs/33558545955
#
# The first is the one that matters for a consumer: `main` itself, green. The
# others are listed because they are what makes the first reproducible rather
# than a single lucky run.
#
# WHAT THAT DOES AND DOES NOT LICENCE
# -----------------------------------
# A green run is evidence about the three jobs below and nothing else. It is not
# evidence that the fleet is measured -- see the scope note at the foot of this
# header, which is now a statement about what has not been written rather than
# an argument that it cannot be.
#
# WHY THE TOOL VERSIONS ARE PINNED EXACTLY
# ----------------------------------------
# This file previously installed `ruff>=0.4` and ran it at its DEFAULTS, with a
# comment arguing that adding a config would widen what passes. The intent was
# right and the mechanism was not: ruff's default rule set is a property of the
# ruff RELEASE, so an unpinned floor means the check's definition changes
# without anyone editing this file -- and it already had. Measured 2026-08-29 on
# 8647be9, `ruff check src tests scripts` reported **36 errors** at ruff 0.16.5
# against the "all checks passed" this comment used to claim, including three
# `# noqa: E402` and one `# noqa: PLC0415` flagged RUF100 UNUSED because those
# rules are not in the current defaults. The declaration had gone stale in place
# and nothing could see it, which is this package's own defect class pointed at
# itself.
#
# So the floor becomes an exact pin. Defaults are kept -- no `[tool.ruff]`
# select was added, nothing was widened, and all 36 findings were fixed in
# `src/` rather than suppressed. Pinning does not weaken the gate; it gives the
# gate a definition that is committed instead of inferred from whatever the
# runner downloaded that morning. Upgrading is then a visible diff with a
# visible findings delta, which is the point.
#
# tests/test_ci_workflow.py enforces the pins, so this reasoning cannot rot back
# into a floor.
#
# SCOPE NOTE: `mlkit portfolio` and `mlkit spine` have NO job here, and the
# reason is that nobody has written one -- not that one is impossible.
#
# This note used to argue the second thing. Its premise was that both commands
# read the eight model repos as sibling checkouts "which do not exist on a
# runner", so any such job would find no repos, exit clean, and hand out a green
# tick for having measured nothing. The first half is true of a bare
# `actions/checkout`. The conclusion does not follow, because a job can make the
# siblings exist. MEASURED 2026-09-02T01:06:40Z, from this environment, on the
# eight repos at their remote mains:
#
#   for r in fray torrent chokepoint choco arabica surge blackout triage; do \
#     git clone --depth 1 https://github.com/Resilient-World/resilient-$r.git $r
#   done
#
#   real 24.53s      du -sh . -> 205M
#   fray 28M  torrent 23M  chokepoint 13M  choco 24M
#   arabica 16M  surge 75M  blackout 14M  triage 13M
#
# That is one checkout step, inside this workflow's existing 15-minute timeout.
# The obstacles that remain are real ones and none of them is the runner: the
# clones above ran with this environment's credentials, so a runner job needs a
# token scoped to all eight and that is a permissions decision, not a technical
# one; a fleet sweep needs a declared expectation to compare against, or it is
# a job that prints numbers nobody adjudicates; and the eight repos' own venvs
# are not reconstructed by a shallow clone, so only the checks that are pure AST
# walks over source would run.
#
# So: NOT WRITTEN, and the honest verdict on whether it should be is NA until
# someone measures a sweep against a declared baseline. What this note may not
# do is keep asserting an impossibility that 24 seconds of clock refutes.

name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

# A second push should cancel the first run rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Pinned exactly, not floored. See the header: ruff's default rule set
        # ships with the release, so `>=` makes this job's meaning depend on the
        # release date rather than on this file.
        run: python -m pip install --upgrade pip "ruff==0.16.5"
      # No config file: mlkit runs ruff at its defaults, so what CI checks is
      # exactly what a contributor gets from a bare `ruff check` at the pinned
      # version. Adding a config to widen what passes would make this job agree
      # with nothing.
      - run: ruff check src tests scripts

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and type checker
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install "mypy==2.3.1" "types-PyYAML>=6.0"
      # Deliberately NOT --ignore-missing-imports. mlkit has exactly one
      # optional third-party import (numpy, inside a probe that reports NA when
      # it fails) and that one is declared in pyproject.toml. A blanket ignore
      # would also silence a genuinely missing first-party module.
      - run: python -m mypy src/resilient_mlkit

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 is what the model repos
        # run. Both, because a package installed into eight environments must
        # not depend on the interpreter that happened to be handy.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_tag_distance.py compares the declared version against the
          # source inside every release tag. actions/checkout fetches NO tags at
          # its default fetch-depth: 1, and that test's fixture would then take
          # its named "no vX.Y.Z tag is visible" skip -- a control that is
          # present, green, and measuring nothing. 0 fetches the full history
          # and the tags with it. The lint and typecheck jobs read no history
          # and keep the default.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: pytest-timeout must be ACTIVE, not merely declared
        # `timeout` is an ini key pytest does not know: without the plugin
        # registered, pytest ignores it silently and pyproject.toml reads as
        # though a limit is in force. Fail the job here, before the suite runs,
        # rather than discovering it from a job that hung for six hours.
        run: python -c "import pytest_timeout; print(pytest_timeout.__file__)"
      - name: Unit tests
        run: python -m pytest tests -q
