# .mlkit/repo.toml — this repo's binding declaration for `mlkit`.
#
# mlkit does not introspect a repo's internals. Eight repos grew separately and
# none of them agree on where a dataloader lives, so generic introspection
# would either be wrong or would quietly degrade into a check that passes
# because it found nothing to test.
#
# Instead this file points at callables in this repo's own source tree. mlkit
# imports them inside this repo's environment and judges what they return.
#
# A binding that is absent makes its check NA with a reason. That is the
# correct outcome for "not wired up yet" -- it is never a pass.

[repo]
name = "REPLACE_ME"

# ── Bindings ────────────────────────────────────────────────────────────────
# Each value is "module.path:callable", resolved against this repo root and
# ./src. Contracts:
#
#   batch()                -> one real batch (dict/tuple of shaped arrays)
#   overfit_one_batch()    -> iterable of loss values, one per step
#   checkpoint_status()    -> {name: "LOADED_PRETRAINED" | "RANDOM_INIT" | "MISSING"}
#   label_counts()         -> {label: count}, counted from real data
#   manifest()             -> [source_id, ...] currently in the pipeline
#   checkpoint_provenance()-> {name: {uri, sha256, licence_url}}
#   splits()               -> {"train": [group_id], "val": [...], "test": [...]}
#                             OR, for a repo with MORE THAN ONE holdout policy
#                             over one panel:
#                               {"tracks": {"<track>": {"train": [...],
#                                                       "val": [...],
#                                                       "test": [...]}, ...}}
#                             `tracks` must be the mapping's ONLY key -- a
#                             value carrying both shapes has declared two
#                             different things and is refused rather than
#                             resolved by preference. R3 applies EVERY clause
#                             it applies to one partition to EACH track, at
#                             the same holdout floor, and the worst verdict
#                             wins. resilient-fray is the case: unseen COUNTY
#                             (groups = 0.5 deg spatial blocks) and unseen
#                             future YEAR (groups = crop years) are two
#                             partitions of one county-year panel, and with
#                             one flat binding only one of them could be
#                             declared or judged.
#   metric_known_answer()  -> [{name, computed, expected, tol}]
#   provenance()           -> {"train": {"real": n, "synthetic": n, ...}, "val": ..., "test": ...}
#   deterministic_run(seed)-> any repr-comparable result
#   placebo_test()         -> {estimate, ci_low, ci_high, run_id}
#   coverage()             -> {nominal, empirical, n, tol}
#                             `nominal` is CROSS-CHECKED against the level
#                             declared in [coverage] below, not trusted as the
#                             standard; see that section.
#   resampling_declaration()
#                          -> {procedure, draws, policy, blocking_unit, unit,
#                              arm, assignment}
#                             `assignment` is ONE MAPPING PER PANEL ROW naming
#                             row_key, arm, block_key and unit_key -- the whole
#                             panel, not the arm. mlkit derives every count,
#                             digest, relation and verdict from it; a binding
#                             that reported its own unit count would be
#                             reporting the operand of its own verdict, which
#                             is what [coverage] below exists to stop for D3.
#                             D6 additionally ties the declared blocks to
#                             splits() above -- a second declaration of the
#                             same partition -- because block_key = row_key
#                             describes a policy with no blocks, is perfectly
#                             self-consistent, and is caught nowhere else.
#   scaling_probe()        -> {0.01: metric, 0.10: metric, 0.25: metric}  (larger is better)
#   hparam_sanity()        -> {lr_range, throughput_curve, winning_config, mlflow_run_id}
#   efficiency()           -> {gpu_util, profiler_trace, dataloader_bound}

[bindings]
# Uncomment and point at real callables as they are wired up.
# batch = "mlkit_bindings:batch"

[manifest]
# Alternative to a manifest() binding: a YAML file with a `sources:` list.
# path = "config/manifest.yaml"

# ── Nominal coverage (D3) ───────────────────────────────────────────────────
# The level this repo's prediction intervals PROMISE, as data. D3's verdict is
# `abs(empirical - nominal) > tol`, and both operands used to arrive in the
# dict `coverage()` returns -- so a binding could set `nominal` equal to the
# empirical coverage it had just measured and PASS on any coverage at all. Two
# repos did exactly that in one tick (docs/ESCALATIONS.md E-M21), one of them
# erasing a shortfall it had truthfully disclosed for its served model.
#
# So the level lives here, beside the binding, and `coverage()`'s own `nominal`
# is adjudicated against it: disagreement is FAIL, absence is NA. Write the
# probability, not the percentage.
[coverage]
# nominal = 0.90

# ── Remote parity (R7) ──────────────────────────────────────────────────────
# Populated once Loop 0 has been performed by the signatory. Region must be
# us-west-2 and the image must be pinned by digest.
[remote]
# region = "us-west-2"
# image  = "<acct>.dkr.ecr.us-west-2.amazonaws.com/resilient-training@sha256:..."
